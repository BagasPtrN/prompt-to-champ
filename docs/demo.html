<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demo — JadiPrompter</title>
<meta name="description" content="Demo pemain-tunggal JadiPrompter: lihat brief, tulis prompt, lihat postermu jadi.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="p2c.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏆</text></svg>">
<style>
/* ---------- khusus demo ---------- */
.top{display:flex;justify-content:space-between;align-items:center;padding:16px 0}
.top a{font-family:var(--mono);font-size:12px;color:var(--muted);text-decoration:none;border:1px solid var(--line-dark);border-radius:999px;padding:6px 13px}
.top a:hover{color:var(--cream);border-color:var(--accent)}
.steprail{display:flex;gap:6px;margin:8px 0 22px}
.steprail .r{flex:1;height:5px;border-radius:99px;background:var(--line)}
.steprail .r.on{background:var(--accent);box-shadow:0 0 12px rgba(227,0,12,.5)}

.stage{max-width:560px;margin:0 auto}

/* brief */
.briefcard{display:flex;gap:14px;align-items:stretch}
.briefcard img{width:118px;height:118px;object-fit:cover;border-radius:14px;border:2px solid var(--line-dark);flex-shrink:0}
.briefcard .bt{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;color:var(--accent-light);text-transform:uppercase}
.briefcard h3{font-size:22px;letter-spacing:-.01em;margin:3px 0 2px}
.briefcard .br{font-size:13px;color:var(--muted)}
.briefcard .usp{font-size:13.5px;margin-top:7px}
.briefcard .mand{display:inline-block;margin-top:8px;font-size:11.5px;font-weight:700;color:var(--gold);border:1px dashed rgba(245,192,105,.45);border-radius:8px;padding:4px 9px}

/* tulis prompt */
textarea.pta{
  width:100%;min-height:130px;resize:vertical;background:var(--surface);color:var(--cream);
  border:2px solid var(--line-dark);border-radius:16px;padding:14px 16px;
  font-family:var(--sans);font-size:16.5px;line-height:1.55;
}
textarea.pta:focus{outline:none;border-color:var(--accent)}
.counter{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:right;margin-top:5px}
.helpbox{background:var(--surface-2);border:1px solid var(--line-dark);border-radius:14px;overflow:hidden;margin-top:12px}
.helpbox summary{display:flex;align-items:center;gap:8px;padding:11px 14px;cursor:pointer;font-weight:700;font-size:13.5px;list-style:none;user-select:none}
.helpbox summary::-webkit-details-marker{display:none}
.helpbox summary::after{content:'▾';margin-left:auto;color:var(--muted);font-size:11px}
.helpbox[open] summary::after{transform:rotate(180deg)}
.helpbox .hg{padding:2px 12px 12px;border-top:1px dashed var(--line-dark)}
.hrow{display:flex;gap:8px;padding:8px 0;border-bottom:1px dashed rgba(var(--cream-rgb),.07);align-items:flex-start}
.hrow:last-child{border:0}
.hl{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);min-width:58px;padding-top:8px;flex-shrink:0}
.hchips{display:flex;flex-wrap:wrap;gap:6px;flex:1}
.hchips button{background:transparent;border:1px solid var(--line-dark);color:rgba(var(--cream-rgb),.82);border-radius:999px;padding:7px 13px;font-family:var(--sans);font-size:13px;font-weight:600;cursor:pointer;transition:.14s}
.hchips button.sel{background:rgba(227,0,12,.16);border-color:var(--accent);color:#fff}
.hchips button.sel::after{content:' ✓';color:var(--accent-light)}
.actions{display:flex;gap:10px;margin-top:16px}
.actions .tile{flex:1}
.note{text-align:center;font-size:12.5px;color:var(--muted);margin-top:12px}

/* poster */
.posterstage{position:relative;aspect-ratio:4/5;border-radius:18px;overflow:hidden;border:2px solid var(--line-dark);background:#0d0809}
.posterstage .bd{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(var(--bblur,16px)) brightness(.55)}
.posterstage .fg{position:absolute;object-fit:contain;filter:hue-rotate(var(--hue,0deg)) saturate(var(--sat,1)) brightness(var(--bri,1));box-shadow:0 18px 50px rgba(0,0,0,.55)}
.posterstage .frame{position:absolute;border:2px solid rgba(255,255,255,.5);border-radius:4px}
.capbar{text-align:center;margin-top:14px}
.capbar .who{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--accent-light);text-transform:uppercase}
.capbar .pr{font-size:13px;color:var(--muted);font-style:italic;margin-top:6px;word-break:break-word}

/* menunggu AI */
.waiting{text-align:center;padding:40px 0}
.waiting .em{font-size:64px;animation:beat 1.1s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.dots::after{content:'';animation:dots 1.4s steps(4) infinite}
@keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}

/* galeri bot */
.botgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.botgrid .bp{border:1.5px solid var(--line);border-radius:12px;overflow:hidden;position:relative;background:var(--surface)}
.botgrid .bp img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block}
.botgrid .bp .nm{position:absolute;left:0;right:0;bottom:0;padding:16px 8px 6px;font-size:11px;font-weight:700;background:linear-gradient(transparent,rgba(10,6,7,.9))}
.badge-note{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted);background:var(--surface-2);border:1px solid var(--line-dark);border-radius:12px;padding:12px 14px;margin-top:18px}
.badge-note .i{font-size:18px}

@media (max-width:520px){
  .briefcard{flex-direction:column}
  .briefcard img{width:100%;height:auto;aspect-ratio:4/3}
  .botgrid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<main class="wrap" style="padding-bottom:60px">

  <div class="top">
    <span class="kicker" style="letter-spacing:.2em">✦ Demo pemain tunggal</span>
    <a href="index.html">← kembali</a>
  </div>

  <div class="steprail" id="rail"><span class="r on"></span><span class="r"></span><span class="r"></span></div>

  <div class="stage" id="stage"><!-- konten via JS --></div>

</main>

<script>
'use strict';
/* ============ data (sama dengan game) ============ */
const BRIEFS = [
  { id:'dimsum', emoji:'🥟', name:'Dimsum Ayam Keju', brand:'Dimsum Kang Dedi', cat:'Poster Makanan',
    desc:'Dimsum ayam keju kukus panas, disajikan di tray dengan topping nori dan saus.',
    usp:'Dikukus fresh saat dipesan, keju meleleh melimpah', price:'Rp15.000', mand:'Promo 4 pcs 15 ribu' },
  { id:'kue', emoji:'🎂', name:'Kue Ulang Tahun Custom', brand:'Kue Bu Ratna', cat:'Poster Makanan',
    desc:'Kue ulang tahun custom dengan cream lembut dan topping buah segar.',
    usp:'Sponge lembut, cream tidak manis berlebih, desain sesuai permintaan', price:'Mulai Rp150.000', mand:'Custom sesuai permintaan' },
  { id:'pempek', emoji:'🐟', name:'Pempek Kapal Selam', brand:'Pempek Asli Palembang', cat:'Poster Makanan',
    desc:'Pempek ikan tenggiri disajikan dengan cuko kental manis-asam segar.',
    usp:'Ikan tenggiri asli, cuko kental manis asam segar', price:'Rp25.000', mand:'Cuko gratis melimpah' },
];
const CHIPS = [
  ['Gaya',   ['foto studio','flat-lay dari atas','gaya majalah editorial','ilustrasi retro']],
  ['Cahaya', ['cahaya lembut','golden hour','cahaya hangat sidelight','terang & bersih']],
  ['Kamera', ['close-up detail','sudut 45 derajat','eye-level','wide angle']],
  ['Latar',  ['latar meja kayu','daun pisang','latar polos pastel','meja rumah makan']],
  ['Mood',   ['hangat & homey','segar & ceria','mewah & elegan','nostalgia']],
];
const BOTS = ['Bu Rina','Pak Deng','Sari','Budi','Mega'];
const BOT_PROMPTS = [
  'close-up keju meleleh, cahaya hangat, latar meja kayu',
  'flat-lay dari atas, terang & bersih, latar polos pastel',
  'gaya majalah editorial, golden hour, eye-level',
  'ilustrasi retro, mood nostalgia, wide angle',
  'foto studio, sudut 45 derajat, hangat & homey',
];

/* ============ rng deterministik (sama pola dengan server) ============ */
function hashSeed(str){
  let h = 2166136261 >>> 0;
  for (let i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return h >>> 0;
}
function rng(seed){
  let s = seed >>> 0;
  return function(){ s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
}
/* transformasi poster — identik logika server: rasio asli utuh (contain) */
function transformFor(key){
  const r = rng(hashSeed(key + '|poster'));
  const fit = 0.9 + r() * 0.1;
  return {
    fit,
    hue: Math.round((r() * 2 - 1) * 14),
    sat: (0.92 + r() * 0.16).toFixed(2),
    bri: (0.95 + r() * 0.1).toFixed(2),
    blur: (10 + r() * 14).toFixed(1),
    dark: (0.35 + r() * 0.25).toFixed(2),
  };
}
function esc(s){ return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ============ render poster (latar blur + poster contain) ============ */
function posterHTML(asset, key){
  const t = transformFor(key);
  /* aset 600×900 (2:3), kanvas 4:5 → fit tinggi, sisakan bar samping */
  const h = 100 * t.fit;               /* % tinggi kanvas */
  const w = h * (600 / 900) * (5 / 4); /* jaga rasio: % lebar relatif kanvas 4:5 */
  const x = (100 - w) / 2, y = (100 - h) / 2;
  return `<div class="posterstage" style="--bblur:${t.blur}px">
    <img class="bd" src="${asset}" alt="" style="filter:blur(${t.blur}px) brightness(${1 - t.dark * 0.5})">
    <img class="fg" src="${asset}" alt="Poster hasil prompt"
         style="--hue:${t.hue}deg;--sat:${t.sat};--bri:${t.bri};
                left:${x}%;top:${y}%;width:${w}%;height:${h}%">
    <div class="frame" style="left:${x}%;top:${y}%;width:${w}%;height:${h}%"></div>
  </div>`;
}

/* ============ state demo ============ */
const stage = document.getElementById('stage');
const railEl = document.getElementById('rail');
let bi = Math.floor(Math.random() * BRIEFS.length);
let prompt = '';
let results = []; /* {briefId, prompt} — riwayat */

function rail(n){
  railEl.querySelectorAll('.r').forEach((el, i) => el.classList.toggle('on', i < n));
}

/* ---------- langkah 1: brief ---------- */
function showBrief(){
  rail(1);
  const b = BRIEFS[bi];
  stage.innerHTML = `
    <span class="kicker">Ronde demo · brief produk</span>
    <h2>${b.emoji} Ini produknya</h2>
    <div class="card briefcard">
      <img src="assets/products/${b.id}.jpg" alt="Foto ${esc(b.name)}">
      <div>
        <div class="bt">${esc(b.cat)} · ${esc(b.brand)}</div>
        <h3>${esc(b.name)}</h3>
        <div class="br">${esc(b.desc)}</div>
        <div class="br">💰 ${esc(b.price)}</div>
        <div class="usp">✨ ${esc(b.usp)}</div>
        <span class="mand">WAJIB: ${esc(b.mand)}</span>
      </div>
    </div>
    <div class="actions"><button class="tile" onclick="showPrompt()">TULIS PROMPTNYA ✍️</button></div>
    <p class="note">Di permainan penuh: semua pemain melihat brief ini bersamaan di HP masing-masing.</p>`;
}

/* ---------- langkah 2: tulis prompt ---------- */
function showPrompt(){
  rail(2);
  const b = BRIEFS[bi];
  stage.innerHTML = `
    <span class="kicker">Tulis bebas — bantuan opsional</span>
    <h2>Susun posternya</h2>
    <textarea class="pta" id="pta" maxlength="400"
      placeholder="Contoh: foto ${esc(b.name.toLowerCase())} close-up, ${esc(b.usp.split(',')[0].toLowerCase())}, latar meja kayu, cahaya hangat…">${esc(prompt)}</textarea>
    <div class="counter" id="cnt"></div>
    <details class="helpbox">
      <summary>🖐 Bantuan kata <span style="font-family:var(--mono);font-size:9.5px;color:var(--muted);font-weight:400">ketuk untuk buka/tutup</span></summary>
      <div class="hg" id="hg">
        ${CHIPS.map(([l, os]) => `
          <div class="hrow"><span class="hl">${l}</span><div class="hchips">
            ${os.map(o => `<button data-o="${esc(o)}">${esc(o)}</button>`).join('')}
          </div></div>`).join('')}
      </div>
    </details>
    <div class="actions">
      <button class="tile ghost" onclick="showBrief()">← brief</button>
      <button class="tile" id="go">KIRIM ✓</button>
    </div>
    <p class="note">Ketuk chip untuk menambah/mengeluarkan frasa — persis seperti di game.</p>`;

  const ta = document.getElementById('pta');
  const cnt = document.getElementById('cnt');
  const go = document.getElementById('go');
  const upd = () => {
    cnt.textContent = ta.value.length + ' / 400 huruf';
    go.disabled = !ta.value.trim();
    go.style.opacity = ta.value.trim() ? 1 : .45;
    document.querySelectorAll('.hchips button').forEach(btn =>
      btn.classList.toggle('sel', ta.value.includes(btn.dataset.o)));
  };
  ta.addEventListener('input', upd);
  document.querySelectorAll('.hchips button').forEach(btn => btn.onclick = () => {
    const ph = btn.dataset.o;
    const cur = ta.value.trim();
    if (cur.includes(ph)){
      /* ketuk lagi = keluarkan frasa */
      let parts = cur.split(',').map(s => s.trim()).filter(Boolean);
      const n0 = parts.length;
      parts = parts.filter(p => p !== ph);
      if (parts.length === n0){
        parts = parts.map(p => p.includes(ph)
          ? p.replace(ph, '').replace(/^[\s,]+|[\s,]+$/g, '') : p).filter(Boolean);
      }
      ta.value = parts.join(', ');
    } else {
      ta.value = (cur ? cur.replace(/[.\s]+$/, '') + ', ' : '') + ph;
    }
    upd();
  });
  go.onclick = () => { prompt = ta.value.trim(); showGenerating(); };
  upd(); ta.focus();
}

/* ---------- langkah 3: menggambar ---------- */
function showGenerating(){
  rail(3);
  const b = BRIEFS[bi];
  stage.innerHTML = `
    <div class="waiting">
      <div class="em">🎨</div>
      <h2>AI Menggambarmu<span class="dots"></span></h2>
      <p class="sub" style="margin:8px auto 0">"${esc(prompt.slice(0, 90))}${prompt.length > 90 ? '…' : ''}"</p>
    </div>`;
  setTimeout(showResult, 1900);
}

/* ---------- langkah 4: hasil + galeri ---------- */
function showResult(){
  rail(3);
  const b = BRIEFS[bi];
  const asset = `assets/posters/${b.id}.jpg`;
  results.push({ briefId: b.id, prompt });
  stage.innerHTML = `
    <span class="kicker">Hasil postermu</span>
    <h2>${b.emoji} ${esc(b.name)}</h2>
    ${posterHTML(asset, prompt)}
    <div class="capbar">
      <div class="who">Promptmu</div>
      <div class="pr">"${esc(prompt)}"</div>
    </div>

    <div class="hr" style="margin:24px 0"></div>
    <span class="kicker">Galeri ronde</span>
    <h2 style="font-size:24px">Poster pemain lain</h2>
    <div class="botgrid">
      ${BOTS.map((n, i) => `
        <div class="bp">
          <img src="${asset}" style="${botStyleCSS(BOT_PROMPTS[i])}" alt="Poster ${n}">
          <div class="nm">${n}</div>
        </div>`).join('')}
    </div>
    <div class="badge-note"><span class="i">💡</span><span><b>Di versi multiplayer:</b> poster tampil satu-per-satu di layar besar,
    semua pemain memberi nilai <b>1–10</b> dari HP-nya, lalu <b>top 3 naik podium</b> dan poin terakumulasi antar ronde.</span></div>

    <div class="actions">
      <button class="tile ghost" onclick="retry()">↻ UBAH PROMPT</button>
      <button class="tile" onclick="nextBrief()">BRIEF BERIKUTNYA →</button>
    </div>
    <p class="note">Demo ini berjalan 100% di browser — tanpa server. Variasi poster mengikuti prompt-mu.</p>`;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* gaya variasi untuk poster bot (inline) */
function botStyleCSS(key){
  const t = transformFor(key);
  return `filter:hue-rotate(${t.hue}deg) saturate(${t.sat}) brightness(${t.bri});transform:scale(${(1 + (t.fit - 0.95)).toFixed(2)})`;
}

function retry(){ showPrompt(); }
function nextBrief(){
  prompt = '';
  bi = (bi + 1) % BRIEFS.length;
  showBrief();
}

showBrief();
</script>
</body>
</html>
